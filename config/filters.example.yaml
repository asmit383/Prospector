# Cheap prefilter rules — applied before any LLM call.
# Copy this to filters.yaml and tune.

remote_only: true

# Drop jobs older than this many days (uses the post date when known; unknown = kept).
max_age_days: 30

min_salary: 30000  # drop jobs with a listed max below this; keep jobs with no salary info

# A job must match at least one of these (case-insensitive substring in title or tags).
include_keywords:
  - automation
  - scraping
  - scraper
  - crawl
  - ml
  - machine learning
  - llm
  - inference
  - backend
  - python

# Region lock: keep only globally-remote or India-eligible roles; drop roles
# restricted to a region you can't work from. Allow signals win over block
# signals. Matching is word-boundary + case-insensitive.
region_filter: true
region_allow:            # if present (title/location/description) → keep
  - anywhere
  - worldwide
  - india
  - apac
  - asia
region_block:            # explicit lock phrases (title + location + description)
  - us only
  - us based
  - based in the united states
  - authorized to work in the us
  - eu only
  - europe only
  - uk only
  - canada only
  - north america only
region_block_location:   # bare region names, checked ONLY in the location field
  - united states
  - usa
  - us
  - north america
  - europe
  - eu
  - emea
  - uk
  - canada

# Drop the job if the title contains any of these.
exclude_title_keywords:
  - senior director
  - vp
  - vice president
  - head of
  - manager
  - lead
